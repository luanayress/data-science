# Training Configuration
# This file contains all settings for model training

training:
  model_type: GradientBoostingClassifier
  random_state: 42
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 5
  
data:
  train_split: 0.8
  test_split: 0.2
  random_state: 42
  
preprocessing:
  scaler_type: StandardScaler
  handle_missing: mean
  encode_categorical: true
  
validation:
  cv_folds: 5
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

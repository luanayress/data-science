# Inference Configuration
# This file contains all settings for model inference/prediction

model:
  version: v1
  path: models/v1/
  files:
    model: model.pkl
    scaler: scaler.pkl
    metadata: metadata.json

input_validation:
  strict: true
  check_types: true
  
prediction:
  probability_threshold: 0.5
  return_probabilities: true
  batch_size: 100
  
output:
  format: json
  include_confidence: true
  round_decimals: 4
